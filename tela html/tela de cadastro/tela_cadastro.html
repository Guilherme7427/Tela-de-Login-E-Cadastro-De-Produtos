<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro</title>
<link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <main class="form-side">
    <form id="cadastro" novalidate>
      <h1>Faça seu cadastro<span></span></h1>

      <label for="nome">Nome</label>
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg>
        <input id="nome" type="text" autocomplete="name" required>
      </div>

      <label for="email">E-mail</label>
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M2 5h20v2l-10 6L2 7V5zm0 4.5l10 6 10-6V19H2V9.5z"/></svg>
        <input id="email" type="email" autocomplete="email" required>
      </div>

      <div class="row">
        <div>
          <label for="cep">CEP</label>
          <div class="field">
            <svg viewBox="0 0 24 24"><path d="M3 5h18v3H3V5zm0 5h18v9H3v-9zm3 2v2h6v-2H6z"/></svg>
            <input id="cep" type="text" inputmode="numeric" placeholder="00000-000" maxlength="9" autocomplete="postal-code" required>
          </div>
        </div>
        <div>
          <label for="numero">Número</label>
          <div class="field">
            <svg viewBox="0 0 24 24"><path d="M9 3L8 8H3v2h4.6l-1 4H2v2h4.1L5 21h2l1.1-5h4L11 21h2l1.1-5H19v-2h-4.6l1-4H21V8h-4.1L18 3h-2l-1.1 5h-4L12 3H9zm1.6 7h4l-1 4h-4l1-4z"/></svg>
            <input id="numero" type="text" inputmode="numeric" autocomplete="off" required>
          </div>
        </div>
      </div>

      <label for="endereco">Endereço</label>
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <input id="endereco" type="text" autocomplete="street-address" required>
      </div>

      <label for="telefone">Telefone</label>
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
        <input id="telefone" type="tel" inputmode="tel" placeholder="(00) 00000-0000" maxlength="15" autocomplete="tel" required>
      </div>

      <label for="obs">Observação</label>
      <div class="field area">
        <textarea id="obs" rows="3" maxlength="300"></textarea>
      </div>

      <div class="row eq">
        <div>
          <label for="senha">Senha</label>
          <div class="field">
            <svg viewBox="0 0 24 24"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2zm-8 0V7a3 3 0 0 1 6 0v2H9z"/></svg>
            <input id="senha" type="password" autocomplete="new-password" required>
          </div>
        </div>
        <div>
          <label for="confirma">Confirmar senha</label>
          <div class="field">
            <svg viewBox="0 0 24 24"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2zm-8 0V7a3 3 0 0 1 6 0v2H9z"/></svg>
            <input id="confirma" type="password" autocomplete="new-password" required>
          </div>
        </div>
      </div>
      <p class="error" id="erro" role="alert"></p>

      <button class="btn" type="submit">Cadastrar</button>

      <p class="alt"><a href="../tela de login/login.html">Já tenho uma conta</a></p>
    </form>
  </main>

  <aside class="art" aria-hidden="true"></aside>

  <script>
    const API_URL = 'http://localhost:8080';
    const PAGINA_LOGIN = '../tela de login/login.html';
    const $ = (id) => document.getElementById(id);

    // Função de busca na API ViaCEP
    async function buscarCEP(cep) {
      const cepLimpo = cep.replace(/\D/g, '');
     
      if (cepLimpo.length !== 8) return;

      const erro = $('erro');
      erro.textContent = '';
      erro.style.color = '';

      try {
        const response = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
        const data = await response.json();

        if (data.erro) {
          erro.textContent = 'CEP não encontrado.';
          return;
        }

        // Formata o endereço unindo Logradouro, Bairro, Cidade e UF
        const enderecoCompleto = `${data.logradouro}${data.bairro ? ', ' + data.bairro : ''} - ${data.localidade}/${data.uf}`;
        $('endereco').value = enderecoCompleto;

        // Move o foco para o campo 'Número' automaticamente
        $('numero').focus();
      } catch (e) {
        erro.textContent = 'Erro ao consultar o CEP. Preencha o endereço manualmente.';
      }
    }

    // Máscara e gatilho de busca do CEP
    $('cep').addEventListener('input', (e) => {
      const d = e.target.value.replace(/\D/g, '').slice(0, 8);
      e.target.value = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;

      // Executa a busca assim que atinge os 8 dígitos
      if (d.length === 8) {
        buscarCEP(d);
      }
    });

    // Garante a busca também ao sair do campo (caso o usuário cole o CEP)
    $('cep').addEventListener('blur', (e) => {
      buscarCEP(e.target.value);
    });

    $('telefone').addEventListener('input', (e) => {
      const d = e.target.value.replace(/\D/g, '').slice(0, 11);
      let v = d;
      if (d.length > 10) v = `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
      else if (d.length > 6) v = `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
      else if (d.length > 2) v = `(${d.slice(0, 2)}) ${d.slice(2)}`;
      e.target.value = v;
    });

    $('cadastro').addEventListener('submit', async function (e) {
      e.preventDefault();
      const erro = $('erro');
      erro.textContent = '';
      erro.style.color = '';

      if (!this.checkValidity()) {
        const invalido = this.querySelector(':invalid');
        erro.textContent = invalido && invalido.type === 'email'
          ? 'Informe um e-mail válido.'
          : 'Preencha todos os campos obrigatórios.';
        return;
      }
      if ($('cep').value.replace(/\D/g, '').length !== 8) { erro.textContent = 'O CEP precisa ter 8 dígitos.'; return; }
      if ($('telefone').value.replace(/\D/g, '').length < 10) { erro.textContent = 'Informe o telefone com DDD.'; return; }
      if ($('senha').value.length < 8) { erro.textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
      if ($('senha').value !== $('confirma').value) { erro.textContent = 'As senhas não coincidem.'; return; }

      const dados = {
        nome: $('nome').value.trim(),
        email: $('email').value.trim(),
        endereco: $('endereco').value.trim(),
        cep: $('cep').value.replace(/\D/g, ''),
        numero: $('numero').value.trim(),
        telefone: $('telefone').value.replace(/\D/g, ''),
        observacao: $('obs').value.trim(),
        senha: $('senha').value
      };

      const btn = this.querySelector('.btn');
      btn.disabled = true;
      try {
        const resp = await fetch(`${API_URL}/usuarios`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });
        const corpo = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          erro.textContent = corpo.erro || 'Não foi possível concluir o cadastro.';
          return;
        }
        erro.style.color = '#7be0a0';
        erro.textContent = 'Cadastro realizado! Redirecionando para o login...';
        setTimeout(() => { window.location.href = PAGINA_LOGIN; }, 1200);
      } catch (err) {
        erro.textContent = 'Não foi possível conectar ao servidor. Verifique se o back-end está rodando.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
